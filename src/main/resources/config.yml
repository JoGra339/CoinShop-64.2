# ---------------- Spieler-Shop ----------------
player-shop:
  # Preisgrenzen (Coins) für das Gesamtangebot
  min-price: 1
  max-price: 1000000
  # So lange bleibt ein Angebot online. Danach landet das Item in der "Abholung".
  # Angebote im Spieler-Shop laufen NIE ab (bleiben, bis sie verkauft oder zurückgenommen werden)

  # --- Verkaufs-Slots (müssen gekauft werden) ---
  # So viele Slots hat jeder Spieler gratis (1 = der erste Slot ist gratis)
  free-slots: 1
  # Preis des ersten Slots. Jeder weitere Slot kostet das Doppelte vom vorherigen
  # (5, 10, 20, 40, 80 ...).
  # Höchstens so viele Slots pro Spieler (Gratis-Slots mitgezählt):
  max-slots: 32
  slot-base-price: 5
  slot-price-multiplier: 2

  # --- Schutz gegen "Zwischenlager"-Missbrauch ---
  # Gebühr beim Einstellen. Sie wird NICHT zurückerstattet (auch nicht beim Abbrechen
  # oder Ablaufen). So kostet es immer Coins, den Shop als Lager zu nutzen.
  listing-fee-percent: 5.0
  min-listing-fee: 1
  # Steuer beim Verkauf: wird dem Verkäufer vom Erlös abgezogen
  sale-tax-percent: 5.0
  # Gebühren und Steuern landen auf dem Konto des Shops (und sind im Glücksrad gewinnbar).

  # Diese Items dürfen NICHT angeboten werden
  blacklist:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW
    - DEBUG_STICK
    - LIGHT
    - SPAWNER
    - REINFORCED_DEEPSLATE

# ---------------- Casino ----------------
# Alle Spiele funktionieren gleich: Der Einsatz geht aufs Konto des Shops, Gewinne zahlt das Konto des Shops
# (höchstens so viel, wie gerade darauf ist). Jackpot = das GANZE Shop-Konto.
# "odds" = Chance 1 zu X pro Spiel, "amounts" = mögliche Gewinne (einer davon, alle gleich wahrscheinlich).
# Die Chancen werden addiert (1 zu 5 + 1 zu 10 + ...). Alles, was nicht passt, ist eine Niete.
# Rund 55 % des Einsatzes kommen im Durchschnitt zurück - das Casino verliert also langfristig nicht.

# Glücksrad: der Klassiker. Mittlerer Einsatz, häufig kleine Gewinne.
wheel:
  price: 25
  jackpot-odds: 15000
  box-odds: 5000                 # Mystery Box: Chance 1 zu X pro Spiel (zusaetzlich zum normalen Ergebnis)
  box-tier: 2
  tiers:
    t1: {odds: 5,   amounts: [10]}
    t2: {odds: 10,  amounts: [25]}
    t3: {odds: 30,  amounts: [75]}
    t4: {odds: 100, amounts: [200, 350, 500]}
    t5: {odds: 750, amounts: [1000, 2000, 3000]}

casino:
  # Spielautomat: hoher Einsatz, seltene aber große Gewinne
  slots:
    price: 50
    jackpot-odds: 20000
    box-odds: 6000
    box-tier: 2
    tiers:
      t1: {odds: 7,    amounts: [25]}
      t2: {odds: 15,   amounts: [75]}
      t3: {odds: 50,   amounts: [300]}
      t4: {odds: 150,  amounts: [700, 1200, 2000]}
      t5: {odds: 1500, amounts: [5000, 8000]}
  # Rubbellos: winziger Einsatz, kleine Gewinne, ab und zu ein Treffer
  scratch:
    price: 5
    jackpot-odds: 12000
    box-odds: 4000
    box-tier: 1
    tiers:
      t1: {odds: 8,    amounts: [5]}
      t2: {odds: 20,   amounts: [10]}
      t3: {odds: 60,   amounts: [30]}
      t4: {odds: 250,  amounts: [100, 200, 400]}
      t5: {odds: 2500, amounts: [1000, 2000]}
  # Doppelt oder Nichts: Einsatz wählen, dann immer wieder verdoppeln - oder rechtzeitig auszahlen.
  double:
    # Die wählbaren Einsätze (höchstens 3)
    stakes: [10, 50, 250]
    # Chance in Prozent, dass eine Verdopplung klappt (4 Verdopplungen in Folge: 2,6 %)
    win-chance-percent: 40
    # Nach so vielen Verdopplungen wird automatisch ausgezahlt (Einsatz x 2^Stufen; höchstens 9)
    max-steps: 7
    # Verliert man ab dieser Stufe, gibt es einen Trostpreis in Prozent des Einsatzes (0 = nie)
    consolation-from-step: 3
    consolation-percent: 50

# ---------------- Farmwelt ----------------
# /farmwelt teleportiert zu einem festen Punkt, mindestens min-distance Blöcke vom Spawn entfernt (in irgendeine
# Richtung). Der Punkt ist für alle gleich und wechselt jeden Tag zusammen mit dem Shop-Wechsel.
farmworld:
  min-distance: 100000
  max-distance: 120000
  # Um den heutigen Farm-Punkt darf niemand (außer Admins) bauen, abbauen, Eimer leeren oder sprengen,
  # damit dort keine Fallen entstehen. 0 = aus.
  protect-radius: 12

# ---------------- Endkampf ----------------
# Bis zum Start-Datum ist das End gesperrt. Wer ins End-Portal geht, bekommt das Anmelde-Menü.
# Zur Startzeit werden alle ANGEMELDETEN Spieler, die online sind, auf die End-Insel teleportiert und der Drache
# wird beschworen. Danach ist das End für alle offen.
# Hast du den Drachen schon besiegt oder willst du keinen Endkampf? Dann: enabled: false
end-fight:
  enabled: true
  # Startzeit (Format: JJJJ-MM-TT HH:MM, Zeitzone wie der Shop). Nach einer Änderung /coinsadmin reload.
  start: "2026-12-20 12:00"
  # Beschwörung: Glocken schlagen, nach dem letzten Schlag erscheint der Drache (10 x 3 s = 30 s)
  bells: 10
  bell-interval-seconds: 3
  # Leben des Drachen: Grundwert + pro WEITEREM Kämpfer. Höchstens health-max.
  # (Der normale Drache hat 200 Leben.)
  health-base: 300
  health-per-player: 150
  health-max: 1000
  # Der Drache macht pro weiterem Kämpfer so viel Prozent mehr Schaden (höchstens damage-max-percent).
  # Gilt für Biss, Feuerbälle, Drachenatem und Blitze.
  damage-per-player-percent: 20
  damage-max-percent: 400
  # Belohnung (Coins) für alle Spieler, die beim Tod des Drachen im End sind
  # Belohnung: Jeder Überlebende bekommt mindestens reward-min Coins. Dazu kommt ein Topf
  # (reward-pool-per-player x Zahl der Überlebenden), der nach Leistung verteilt wird:
  # Schaden am Drachen und zerstörte End-Kristalle (Gewichtung in Prozent).
  reward-min: 1000
  reward-pool-per-player: 4000
  reward-damage-weight: 60
  reward-crystal-weight: 40

# ---------------- Phantome ----------------
# Phantome erscheinen nur bei Vollmond (Oberwelt) und im End. Das End hat von Natur aus keine Phantome,
# deshalb lässt das Plugin dort in der Nähe von Spielern welche erscheinen.
phantoms:
  only-full-moon-and-end: true
  spawn-in-end: true
  # Alle 10 Sekunden pro Spieler im End: Chance auf ein Phantom, solange weniger als "end-max-nearby" in der Nähe sind
  end-spawn-chance: 0.35
  end-max-nearby: 3

# ---------------- Börse ----------------
# Ein Kurs für alle. Er ändert sich einmal am Tag zusammen mit dem Shop-Wechsel.
# Man kauft Aktien mit einem beliebigen Coin-Betrag (nur ganze Aktien, Rest wird nicht abgebucht).
# Beispiel: Kurs 2, du zahlst 10 Coins -> (ohne Gebühr) 5 Aktien. Steigt der Kurs auf 4, sind sie 20 Coins wert.
stock:
  # Steuer auf den Gewinn beim Verkauf (Satz wie die Verkaufssteuer im Spieler-Shop; Lizenz Steuerfrei wirkt)
  tax-enabled: true
  # Gebühr (Ausgabeaufschlag) in Prozent, bei Kauf UND Verkauf. Sie geht aufs Shop-Konto.
  fee-percent: 5
  # Kurs beim allerersten Start
  start-price: 10
  # Der Kurs bleibt immer zwischen diesen Grenzen (höchstens 100)
  min-price: 1
  max-price: 1000
  # Wie stark der Kurs pro Tag schwankt (0.45 = typisch etwa +-45 %, große Sprünge sind möglich)
  volatility: 0.45
  # Zu diesem Kurs wird der Kurs sanft hingezogen, damit er nicht dauerhaft bei 1 oder 100 klebt
  anchor-price: 20
  reversion: 0.08
  # Wie viele Tage Verlauf im Menü angezeigt werden
  history-days: 7
  # Die festen Kauf-Beträge im Menü (die ersten 3 werden angezeigt)
  quick-amounts: [10, 100, 1000]

# ---------------- Investitionen (Sets) ----------------
# Jedes Item eines Sets gibt es nur EINMAL auf dem Server (wie Straßen bei Monopoly).
# "price" = Preis pro Item = tägliches Einkommen, wenn man das KOMPLETTE Set besitzt.
# Teilbesitz bringt einen Teil des Einkommens (siehe percent-by-owned-count).
# Achtung: Die Namen der Einträge (set01, set02 ...) werden zum Speichern benutzt - nicht umbenennen!
investments:
  # Ein Item kostet (Preis des Sets) x Faktor. Das Einkommen bleibt beim Set-Preis. Jedes Set bekommt seinen eigenen
  # ganzzahligen Faktor zwischen min und max (feste Zufallszahl, bleibt immer gleich). Ein Set hat 3 Items, das KOMPLETTE Set
  # rechnet sich also nach 3 x Faktor Tagen: Faktor 1 = 3 Tage, Faktor 5 = 15 Tage (so gewollt: 3 bis 15 Tage).
  # Beispiel: Set mit 1000 Coins Einkommen pro Tag und Faktor 3: ein Item kostet 3000 Coins, das ganze Set 9000 und rechnet sich nach 9 Tagen.
  # Ein einzelnes Set kann mit "price-multiplier: X" einen festen Wert bekommen.
  price-multiplier-min: 1
  price-multiplier-max: 5
  # Wie viel Prozent des Set-Einkommens man bekommt, wenn man 1, 2 ... Items des Sets besitzt.
  # (Das komplette Set bringt immer 100 %.)
  percent-by-owned-count:
    1: 10
    2: 35
  sets:
    set01: {name: "Drachenhort",          price: 1000, items: [DRAGON_EGG, ELYTRA, DRAGON_HEAD]}
