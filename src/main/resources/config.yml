    - ENCHANTED_BOOK
    - TEST_BLOCK
    - TEST_INSTANCE_BLOCK

  # Preise pro EINZELNEM Item. Gesamtpreis = Menge x Preis (fest für den ganzen Tag).
  # Es gilt der ERSTE passende Eintrag von oben nach unten. Genaue Namen zuerst, Gruppen (mit *) danach.
  # Die seltensten Items kosten rund 100000 Coins - alles andere ist daran angelehnt.
  prices:
