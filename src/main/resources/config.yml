  erfolge:       {name: "Erfolgsjäger",    icon: NETHER_STAR,     price: 7200, value: 10, levels: [{price: 10800, value: 20}, {price: 18000, value: 30}]}   # % mehr Belohnung für Erfolge und geheime Erfolge
