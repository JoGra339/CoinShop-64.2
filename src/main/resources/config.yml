# ---------------- Schlafen ----------------
# Schlafen genug aktive Spieler einer Welt (Prozent), läuft die Nacht im Zeitraffer ab (nur die Tageszeit,
# sonst ändert sich nichts). "Aktiv" = nicht im Zuschauer-Modus und nicht länger als afk-minutes bewegungslos.
sleep:
  enabled: true
  percent: 10
  # Wie viele Zeit-Ticks pro Server-Tick vergehen. 120 = eine ganze Nacht dauert höchstens 5 Sekunden
  # (kleinere Werte machen es langsamer, die Nacht dauert dann länger als 5 Sekunden)
  speed: 120
  afk-minutes: 5

# ---------------- Teleportieren ----------------
teleport:
  # Wartezeit vor jeder Teleportation (Sekunden)
  delay-seconds: 3
  # So lange ist eine /tpa-Anfrage gültig (Sekunden)
  request-timeout-seconds: 60

# ---------------- Freecam ----------------
freecam:
  enabled: true
  # So weit darf man sich von seinem Körper entfernen (Blöcke)
  max-distance: 1000   # Radius in Blöcken (waagerecht); Höhe und Tiefe sind unbegrenzt

# ---------------- Coins allgemein ----------------
coins:
  # Größter Betrag, der auf einmal überwiesen werden darf (Schutz vor Tippfehlern)
  max-transfer: 1000000000
  # Einmaliges Startguthaben für Spieler, die zum allerersten Mal beitreten (0 = keins)
  start-bonus: 100

# ---------------- Login-Serie (Teil des täglichen Einkommens) ----------------
# Wer an mehreren Tagen hintereinander (Tag = 12:00 bis 12:00 Uhr) auf dem Server ist, bekommt einen
# Serien-Bonus auf sein tägliches Einkommen: per-day x (Tag der Serie - 1), höchstens bis max-days Tage.
# Jeder 7. Tag der Serie gibt zusätzlich weekly-bonus. Das Ganze wird mit dem Einkommen beim Shop-Wechsel
# ausgezahlt (Grundeinkommen steht unter daily-income).
login-streak:
  enabled: true
  per-day: 5
  max-days: 7
  weekly-bonus: 100
  # Alle 7 Tage eine Mystery Box; Stufe je voller Woche (danach bleibt die letzte Stufe)
  box-tiers: [1, 1, 2, 2, 3, 3, 4, 4, 5]

# ---------------- Tägliche Aufgaben ----------------
# Jeden Tag (Wechsel zur Shop-Zeit) gibt es für alle dieselben Aufgaben aus dem Pool: easy-count leichte und hard-count schwere.
# amount = [kleinste, größte] Zielmenge, reward = [kleinste, größte] Belohnung (je größer die Aufgabe,
# desto größer die Belohnung). stat = was gezählt wird (mined, wood, stone, diamonds, fishing, creatures,
# walked, placed, trades, playtime). Wer alle Aufgaben des Tages schafft, bekommt zusätzlich bonus-all.
quests:
  enabled: true
  easy-count: 3        # 3 leichte Aufgaben (untere Spanne von amount/reward)
  hard-count: 3        # 3 schwere Aufgaben (obere Spanne, mal hard-amount / hard-reward)
  hard-amount: 1.5
  hard-reward: 2.2
  bonus-all: 120       # Bonus, wenn alle 6 Aufgaben des Tages geschafft sind
  pool:
    mined:     {stat: mined,     name: "Blöcke abbauen",    unit: "Blöcke",   icon: DIAMOND_PICKAXE, amount: [200, 600],  reward: [20, 60]}
    wood:      {stat: wood,      name: "Holz sammeln",      unit: "Stämme",   icon: OAK_LOG,         amount: [40, 120],   reward: [20, 55]}
    stone:     {stat: stone,     name: "Stein abbauen",     unit: "Blöcke",   icon: COBBLESTONE,     amount: [150, 500],  reward: [15, 50]}
    diamonds:  {stat: diamonds,  name: "Diamanterze finden", unit: "Erze",    icon: DIAMOND_ORE,     amount: [3, 10],     reward: [40, 110]}
    fishing:   {stat: fishing,   name: "Angeln",            unit: "Fänge",    icon: FISHING_ROD,     amount: [10, 30],    reward: [20, 55]}
    creatures: {stat: creatures, name: "Kreaturen besiegen", unit: "Kreaturen", icon: IRON_SWORD,    amount: [15, 50],    reward: [20, 60]}
    walked:    {stat: walked,    name: "Weit wandern",      unit: "Blöcke",   icon: LEATHER_BOOTS,   amount: [1000, 3000], reward: [15, 45]}
    placed:    {stat: placed,    name: "Bauen",             unit: "Blöcke",   icon: BRICKS,          amount: [150, 500],  reward: [15, 50]}
    trades:    {stat: trades,    name: "Mit Dorfbewohnern handeln", unit: "Handel", icon: EMERALD,   amount: [3, 10],     reward: [30, 80]}
    enchanted: {stat: enchanted, name: "Gegenstände verzaubern", unit: "Gegenstände", icon: ENCHANTING_TABLE, amount: [2, 6], reward: [30, 80]}
    brewed:    {stat: brewed,    name: "Tränke brauen",      unit: "Tränke",   icon: BREWING_STAND,   amount: [3, 12],     reward: [30, 80]}
    bred:      {stat: bred,      name: "Tiere züchten",      unit: "Zuchten",  icon: WHEAT,           amount: [3, 10],     reward: [25, 70]}
    harvest:   {stat: harvest,   name: "Ernte einbringen",   unit: "Pflanzen", icon: HAY_BLOCK,       amount: [40, 150],   reward: [20, 60]}

# ---------------- Normale Welt: seltene Funde beim Angeln und Abbauen ----------------
# "odds" heißt: 1 zu so viele pro Fang bzw. pro abgebautem Erz. Selbst platzierte Erze zählen nicht.
activity:
  enabled: true
  fishing:
    odds: 50                 # Glücksfang: etwas Coins
    coins: [20, 80]
    box-odds: 3000           # Schatzfund: Coins und eine Mystery Box (Stufe 1)
    coins-epic: [300, 800]
  mining:
    odds: 15                 # Diamant-, Smaragderz und Antiker Schutt
    coins-diamond: [40, 120]
    coins-emerald: [30, 90]
    coins-debris: [100, 300]

# ---------------- Titel ----------------
# Titel stehen in Chat und Tab-Liste vor dem Namen. Ein Spieler kann mehrere besitzen, trägt aber nur einen
# (Auswahl im Menü /titel). "color" ist ein Minecraft-Farbname (gold, aqua, red, green, dark_purple ...).
titles:
  # Jeder Titel kann eine Wirkung haben (effect), solange man ihn TRAEGT.
  # Typen: task-boost (Aufgaben-Fortschritt zaehlt value % mehr; stat = bestimmte Aufgabenart, leer = alle),
  #        miner-double (value % Chance, dass ein abgebauter Block bei der Miner-Quest einen weiteren Block abhakt),
  #        miner-reward (value % mehr Krypto bei der Miner-Quest), shop-discount (value % Rabatt im Server-Shop),
  #        casino-bonus (value % mehr Casino-Gewinne), tax-discount (value % weniger Verkaufssteuer im Spieler-Shop),
  #        bounty-bonus (value % mehr beim Kassieren von Kopfgeld), black-chance (Prozentpunkte Kaufchance im Schwarzmarkt),
  #        slot-discount (value % Rabatt auf Revier-Slots), boost-<lizenz> (value % mehr, z. B. boost-aufgaben,
  #        boost-treue, boost-sammler, boost-erfolge, boost-investor), ws-order-size (neue Grosshandel-Auftraege value % kleiner oder - nach Wahl des Spielers - groesser)
  # text steht im Titel-Menue.
  richest: {name: "Goldkaiser", color: gold, icon: GOLD_INGOT, effect: {type: shop-discount, value: 5, text: "5 % Rabatt im Server-Shop"}}
